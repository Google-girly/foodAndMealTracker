name: Run Tests

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    test:

        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up java
              uses: actions/setup-java@v4
              with:
                 distribution: "temurin"
                 java-version: "21"
            - name: Make gradlew executable
              run: chmod +x gradlew
              working-directory: backend

            - name: Run tests
              run: ./gradlew test
              working-directory: backend
